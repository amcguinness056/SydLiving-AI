name: Deploy SydLiving AI to GCP Cloud Run

on:
  workflow_run:
    workflows: ["Build and Test SydLiving AI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

# Mandatory permissions for requesting the GitHub OIDC JWT token
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'australia-southeast1' }}
  APP_NAME: sydliving
  ARTIFACT_REPO: sydliving-repo

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Determine Target Commit SHA
        id: target-commit
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target-commit.outputs.sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.target-commit.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ----------------------------------------------------
      # 1. Build and Deploy Backend Service
      # ----------------------------------------------------
      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ steps.target-commit.outputs.sha }},${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-backend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ steps.target-commit.outputs.sha }}
          region: ${{ env.REGION }}

      # ----------------------------------------------------
      # 2. Build and Deploy Frontend Service
      # ----------------------------------------------------
      - name: Fetch Google Maps API Key from Secret Manager
        id: maps-key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=${{ env.APP_NAME }}-google-maps-api-key --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "")
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=${{ steps.deploy-backend.outputs.url }}
            VITE_GOOGLE_MAPS_API_KEY=${{ steps.maps-key.outputs.key }}
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ steps.target-commit.outputs.sha }},${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-frontend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ steps.target-commit.outputs.sha }}
          region: ${{ env.REGION }}

      # Update cache ref
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ----------------------------------------------------
      # 3. Deploy to Firebase Hosting CDN (Custom Domain)
      # ----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend for Firebase Hosting
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_MAPS_API_KEY: ${{ steps.maps-key.outputs.key }}
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }}

      # ----------------------------------------------------
      # 4. Deployment Summary
      # ----------------------------------------------------
      - name: Output Deployment URLs
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Custom Domain:** [https://sydliving.com](https://sydliving.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase Hosting URL:** [https://${{ env.PROJECT_ID }}.web.app](https://${{ env.PROJECT_ID }}.web.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Cloud Run URL:** [${{ steps.deploy-frontend.outputs.url }}](${{ steps.deploy-frontend.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Cloud Run URL:** [${{ steps.deploy-backend.outputs.url }}](${{ steps.deploy-backend.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit:** \`${{ steps.target-commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
